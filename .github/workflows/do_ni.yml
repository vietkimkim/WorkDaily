name: Đo Ni Đóng Giày — 6h50 sáng

on:
  schedule:
    - cron: '50 23 * * *'    # 23:50 UTC = 06:50 giờ VN
  workflow_dispatch:
    inputs:
      do_lai:
        description: 'Đo lại TOÀN BỘ hồ sơ ngay (bỏ qua lịch mỗi tháng)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: do-ni
  cancel-in-progress: false

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Kiểm tra truy cập nguồn dữ liệu
        run: |
          python -c "
          import requests, sys
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'}
          r = requests.get('https://xskt.com.vn/xstv/10-ngay', headers=H, timeout=30)
          print('HTTP', r.status_code, '|', len(r.text), 'bytes')
          sys.exit(0 if r.status_code == 200 and len(r.text) > 5000 else 'Nguon du lieu chan')
          "

      - name: Đo ni và gửi email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.do_lai }}" = "true" ]; then
            python -u do_ni.py --do-lai 2>&1 | tee do_ni_log.txt
          else
            python -u do_ni.py 2>&1 | tee do_ni_log.txt
          fi

      - name: Lưu HỒ SƠ ĐO NI + sổ tiến cứu + log vào repo
        if: always()
        run: |
          git config user.name  "doni-bot"
          git config user.email "actions@github.com"
          mkdir -p log
          cp -f do_ni_log.txt "log/do-ni-$(date -u -d '+7 hours' +%Y-%m-%d).txt" 2>/dev/null || true
          git add -A data log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Do ni $(date -u -d '+7 hours' +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push || true
