name: Kiểm chứng Miền Bắc Giải Nhất

on:
  workflow_dispatch:        # chạy TAY — kiểm chứng một lần, không phải job hằng ngày

permissions:
  contents: write

jobs:
  kiem_chung:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Nạp đủ 450 kỳ Miền Bắc (cần >=300 cho 2 khối độc lập)
        run: |
          python -c "
          import engine as E
          kho = E.doc_master()
          ky_mb = len(kho['dai'].get('36', {}).get('ky', [])) if kho else 0
          print('Kho hien co', ky_mb, 'ky Mien Bac')
          if ky_mb < 450:
              print('Tai them tu web...')
              E.lay_du_lieu(36, 450)
          "

      - name: Chạy kiểm chứng và GỬI EMAIL
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python -u kiem_chung_mb.py 2>&1 | tee kiem_chung_mb.txt

      - name: Lưu kết quả vào repo
        if: always()
        run: |
          git config user.name  "kiemchung-bot"
          git config user.email "actions@github.com"
          mkdir -p log
          cp -f kiem_chung_mb.txt "log/kiem-chung-mb-$(date -u -d '+7 hours' +%Y-%m-%d).txt" 2>/dev/null || true
          git add -A log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Kiem chung MB $(date -u -d '+7 hours' +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push || true
