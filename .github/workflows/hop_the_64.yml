name: Hợp Thể 64 con — 6h45 sáng

on:
  schedule:
    - cron: '45 23 * * *'    # 23:45 UTC = 06:45 giờ VN
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hop-the-64
  cancel-in-progress: false

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Kiểm tra truy cập nguồn dữ liệu
        run: |
          python -c "
          import requests, sys
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'}
          r = requests.get('https://xskt.com.vn/xstv/10-ngay', headers=H, timeout=30)
          print('HTTP', r.status_code, '|', len(r.text), 'bytes')
          sys.exit(0 if r.status_code == 200 and len(r.text) > 5000 else 'Nguon du lieu chan')
          "

      - name: Chạy Hợp Thể 64 và gửi email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python -u hop_the_64.py 2>&1 | tee hop_the_64_log.txt

      - name: Lưu SỔ TIẾN CỨU + log vào repo
        if: always()
        run: |
          git config user.name  "hopthe64-bot"
          git config user.email "actions@github.com"
          mkdir -p log
          cp -f hop_the_64_log.txt "log/hop-the-64-$(date -u -d '+7 hours' +%Y-%m-%d).txt" 2>/dev/null || true
          git add -A data log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Hop the 64 $(date -u -d '+7 hours' +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push || true
