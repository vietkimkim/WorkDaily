name: XSMN chấm điểm 22h

on:
  schedule:
    - cron: '0 15 * * *'    # 15:00 UTC = 22:00 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsmn-cham-diem
  cancel-in-progress: false

jobs:
  cham:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Chấm điểm dự báo sáng nay
        run: python -u cham_diem.py 2>&1 | tee cham_diem.txt

      - name: Lưu kết quả vào repo
        if: always()
        run: |
          git config user.name  "xsmn-bot"
          git config user.email "actions@github.com"
          mkdir -p log
          cp -f cham_diem.txt "log/cham-$(date -u -d '+7 hours' +%Y-%m-%d).txt" 2>/dev/null || true
          git add -A theo_doi log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Chấm điểm $(date -u -d '+7 hours' +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push || true
